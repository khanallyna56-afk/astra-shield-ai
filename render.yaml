# Render Blueprint: Dashboard -> New -> Blueprint -> select this repo -> Apply.
# Creates: Postgres (free), FastAPI backend (Docker, free), React frontend (static site).
databases:
  - name: astra-shield-db
    plan: free
    region: singapore
    databaseName: astra
    user: astra

services:
  - type: web
    name: astra-shield-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astra-shield-db
          property: connectionString
      - key: DATA_MODE
        value: live
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: https://astra-shield-[a-z0-9-]+\.onrender\.com

  - type: web
    name: astra-shield-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_HOST
        fromService:
          type: web
          name: astra-shield-api
          property: host
